name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node check-content.js
      - run: node test-profile.js
      - run: node test-sync.js
      - run: node test-ai.js
      - run: node test-sw.js
      - run: node test-config.js
